baseURL = 'https://tangben.bot.cd'
defaultContentLanguage = 'zh-cn'
title = '哈基米的博客'
theme = 'PaperMod'
enableRobotsTXT = true

[languages]
  [languages.zh-cn]
    label = '简体中文'
    locale = 'zh-CN'

[params]
  author = '哈基米'
  description = '记录 AI、工程实践与日常思考。'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = true
  TocOpen = false

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[taxonomies]
  tag = 'tags'
  category = 'categories'

[menu]
  [[menu.main]]
    name = '首页'
    url = '/'
    weight = 10
  [[menu.main]]
    name = '文章'
    url = '/posts/'
    weight = 20
  [[menu.main]]
    name = '归档'
    url = '/archives/'
    weight = 30
  [[menu.main]]
    name = '搜索'
    url = '/search/'
    weight = 40
